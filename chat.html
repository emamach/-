<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#1769aa"
  >

  <link
    rel="icon"
    href="assets/icon-192.png"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <title>المحادثة - دجاج اليمامة</title>
</head>


<body>

<main>

  <div class="chat-page-container">

    <!-- رأس المحادثة -->

    <div class="chat-page-header">

      <img
        src="assets/icon-192.png"
        alt="دجاج اليمامة"
        class="chat-logo"
      >

      <h1>
        💬 محادثة دجاج اليمامة
      </h1>

      <p>
        تواصل مباشرة مع إدارة المتجر
      </p>

    </div>


    <!-- معلومات الطلب -->

    <section class="order-summary">

      <h2>
        📦 ملخص الطلب
      </h2>

      <div id="order-summary-content">
        جاري تحميل الطلب...
      </div>

    </section>


    <!-- المحادثة -->

    <section class="chat-page-box">

      <div
        id="messages"
        class="messages"
      ></div>


      <!-- إدخال الرسالة -->

      <div class="chat-input-area">

        <textarea
          id="message-input"
          rows="2"
          placeholder="اكتب رسالتك للإدارة..."
        ></textarea>


        <button
          type="button"
          onclick="sendMessage()"
        >
          إرسال
        </button>

      </div>

    </section>


    <!-- أزرار الطلب -->

    <div class="chat-actions">

      <button
        type="button"
        class="track-button"
        onclick="goTracking()"
      >
        📦 تتبع الطلب
      </button>


      <button
        type="button"
        class="call-button"
        onclick="callManager()"
      >
        📞 الاتصال بالإدارة
      </button>


      <button
        type="button"
        class="home-button"
        onclick="window.location.href='index.html'"
      >
        🏠 العودة للمتجر
      </button>

    </div>

  </div>

</main>


<script>

"use strict";


/* =========================================
   رقم إدارة المتجر
   ========================================= */

const MANAGER_PHONE =
  "";


/* =========================================
   تحميل الطلب
   ========================================= */

function getOrder() {

  const saved =
    localStorage.getItem(
      "yamama_last_order"
    );


  if (!saved) {
    return null;
  }


  try {

    return JSON.parse(saved);

  } catch {

    return null;

  }

}


/* =========================================
   عرض ملخص الطلب
   ========================================= */

function renderOrder() {

  const order =
    getOrder();


  const box =
    document.getElementById(
      "order-summary-content"
    );


  if (!order) {

    box.innerHTML = `

      <p>
        لا يوجد طلب محفوظ.
      </p>

      <button
        class="home-button"
        onclick="window.location.href='index.html'"
      >
        العودة إلى المتجر
      </button>

    `;

    return;

  }


  box.innerHTML = `

    <div class="order-row">

      <strong>
        رقم الطلب:
      </strong>

      <span>
        ${escapeHTML(order.id)}
      </span>

    </div>


    <div class="order-row">

      <strong>
        المنتج:
      </strong>

      <span>
        ${escapeHTML(order.productName)}
      </span>

    </div>


    <div class="order-row">

      <strong>
        الكمية:
      </strong>

      <span>
        ${escapeHTML(order.quantity || 1)}
      </span>

    </div>


    <div class="order-row">

      <strong>
        السعر:
      </strong>

      <span>
        ${escapeHTML(order.price)}
        ل.س
      </span>

    </div>


    <div class="order-row">

      <strong>
        الحالة:
      </strong>

      <span class="order-status">
        ${escapeHTML(order.status || "تم الاستلام")}
      </span>

    </div>

  `;

}


/* =========================================
   تحميل الرسائل
   ========================================= */

function getMessages() {

  const saved =
    localStorage.getItem(
      "yamama_messages"
    );


  if (!saved) {
    return [];
  }


  try {

    return JSON.parse(saved);

  } catch {

    return [];

  }

}


/* =========================================
   حفظ الرسائل
   ========================================= */

function saveMessages(messages) {

  localStorage.setItem(
    "yamama_messages",
    JSON.stringify(messages)
  );

}


/* =========================================
   عرض الرسائل
   ========================================= */

function renderMessages() {

  const container =
    document.getElementById(
      "messages"
    );


  const messages =
    getMessages();


  container.innerHTML = "";


  if (messages.length === 0) {

    container.innerHTML = `

      <div class="system-message">

        👋 أهلاً بك في إدارة دجاج اليمامة.

        <br>

        تم استلام طلبك ويمكنك التواصل معنا
        من خلال هذه المحادثة.

      </div>

    `;

    return;

  }


  messages.forEach(
    message => {

      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        message.sender === "customer"
          ? "message customer"
          : "message manager";


      bubble.innerHTML = `

        <div class="message-text">
          ${escapeHTML(message.text)}
        </div>

        <div class="message-time">
          ${formatTime(message.time)}
        </div>

      `;


      container.appendChild(
        bubble
      );

    }
  );


  container.scrollTop =
    container.scrollHeight;

}


/* =========================================
   إرسال رسالة
   ========================================= */

function sendMessage() {

  const input =
    document.getElementById(
      "message-input"
    );


  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  const order =
    getOrder();


  const messages =
    getMessages();


  messages.push({

    id:
      "msg-" +
      Date.now(),

    orderId:
      order
        ? order.id
        : "",

    sender:
      "customer",

    text:
      text,

    time:
      new Date().toISOString()

  });


  saveMessages(
    messages
  );


  input.value =
    "";


  renderMessages();

}


/* =========================================
   زر Enter
   ========================================= */

document
  .getElementById(
    "message-input"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================================
   الانتقال للتتبع
   ========================================= */

function goTracking() {

  const order =
    getOrder();


  if (!order) {

    alert(
      "لا يوجد طلب محفوظ."
    );

    return;

  }


  window.location.href =
    "tracking.html";

}


/* =========================================
   الاتصال بالإدارة
   ========================================= */

function callManager() {

  if (!MANAGER_PHONE) {

    alert(
      "سيتم إضافة رقم إدارة دجاج اليمامة عند إعداد بيانات الإدارة."
    );

    return;

  }


  window.location.href =
    "tel:" +
    MANAGER_PHONE;

}


/* =========================================
   تنسيق الوقت
   ========================================= */

function formatTime(value) {

  try {

    return new Date(value)
      .toLocaleTimeString(
        "ar",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

  } catch {

    return "";

  }

}


/* =========================================
   حماية النص
   ========================================= */

function escapeHTML(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================
   تشغيل الصفحة
   ========================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    renderOrder();

    renderMessages();

  }
);

</script>

</body>

</html>
