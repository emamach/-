<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#1769aa"
  >

  <link
    rel="icon"
    href="assets/icon-192.png"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <title>دجاج اليمامة</title>

</head>


<body>


  <!-- =================================
       الشريط المتحرك
       ================================= -->

  <div class="ticker-wrap">

    <div
      class="ticker"
      id="ticker-el"
    >
      🔥 أهلاً بكم في متجر دجاج اليمامة - دجاج طازج يومياً وتوصيل مباشر 🔥
    </div>

  </div>


  <!-- =================================
       رأس الصفحة
       ================================= -->

  <header>

    <button
      class="btn-top-chat"
      type="button"
      onclick="openChat()"
    >
      💬 تحدث مع المدير
    </button>


    <img
      src="assets/icon-192.png"
      alt="دجاج اليمامة"
      class="store-logo"
    >


    <div class="brand-title">
      دجاج اليمامة
    </div>


    <div class="brand-subtitle">
      دجاج طازج يومياً
    </div>

  </header>


  <!-- =================================
       المنتجات
       ================================= -->

  <main>

    <section
      class="grid"
      id="products-grid"
    ></section>


    <!-- =================================
         أزرار الخدمات
         ================================= -->

    <div class="store-actions">

      <button
        class="store-action-button"
        type="button"
        onclick="openTracking()"
      >
        📦 تتبع الطلب
      </button>


      <button
        class="store-action-button"
        type="button"
        onclick="openChat()"
      >
        💬 المحادثة مع الإدارة
      </button>

    </div>

  </main>


  <!-- =================================
       نافذة المحادثة
       ================================= -->

  <div
    class="chat-modal"
    id="chat-modal"
  >

    <div class="chat-box">


      <div class="chat-header">

        <span>
          💬 إدارة دجاج اليمامة
        </span>


        <button
          type="button"
          onclick="closeChat()"
          style="
            background:none;
            border:none;
            color:white;
            font-size:20px;
            cursor:pointer;
          "
        >
          ✕
        </button>

      </div>


      <div
        class="chat-body"
        id="chat-preview"
      >

        <div class="bubble admin">
          أهلاً وسهلاً بكم في دجاج اليمامة.
          يمكنكم إرسال طلبكم أو الاستفسار من الإدارة.
        </div>

      </div>


      <button
        class="action-btn"
        type="button"
        onclick="window.location.href='chat.html'"
      >
        فتح المحادثة
      </button>

    </div>

  </div>


  <!-- =================================
       JavaScript
       ================================= -->

  <script src="js/products.js"></script>


  <script>

    "use strict";


    /* =================================
       الشريط المتحرك
       ================================= */

    function loadTicker() {

      const saved =
        localStorage.getItem(
          "yamama_settings"
        );


      if (!saved) {
        return;
      }


      try {

        const settings =
          JSON.parse(saved);


        if (
          settings.ticker &&
          settings.ticker.trim()
        ) {

          document
            .getElementById("ticker-el")
            .textContent =
              settings.ticker;

        }

      } catch {

        console.log(
          "تعذر تحميل الشريط"
        );

      }

    }


    /* =================================
       فتح المحادثة
       ================================= */

    function openChat() {

      const modal =
        document.getElementById(
          "chat-modal"
        );


      modal.style.display =
        "flex";

    }


    /* =================================
       إغلاق المحادثة
       ================================= */

    function closeChat() {

      document
        .getElementById(
          "chat-modal"
        )
        .style.display =
          "none";

    }


    /* =================================
       تتبع الطلب
       ================================= */

    function openTracking() {

      const order =
        localStorage.getItem(
          "yamama_last_order"
        );


      if (!order) {

        alert(
          "لا يوجد طلب محفوظ حالياً."
        );

        return;

      }


      window.location.href =
        "tracking.html";

    }


    /* =================================
       إغلاق النافذة عند الضغط خارجها
       ================================= */

    document
      .getElementById("chat-modal")
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {

            closeChat();

          }

        }
      );


    /* =================================
       تشغيل الصفحة
       ================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadTicker();

      }
    );

  </script>


</body>

</html>
