`;

  const response = await fetch(
    "https://api.gmi-serving.com/v1/chat/completions",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`
      },

      body: JSON.stringify({
        model: "openai/gpt-5.6",

        messages: [
          {
            role: "system",
            content:
              "You are a senior software engineer specializing in web application debugging, architecture, HTML, CSS and JavaScript."
          },
          {
            role: "user",
            content: prompt
          }
        ],

        temperature: 0,

        max_tokens: 12000
      })
    }
  );

  if (!response.ok) {
    const errorText = await response.text();

    throw new Error(
      `GMI API Error ${response.status}: ${errorText}`
    );
  }

  const data = await response.json();

  const result =
    data?.choices?.[0]?.message?.content;

  if (!result) {
    throw new Error(
      "لم تصل نتيجة من نموذج GMI Cloud."
    );
  }

  return result;
}

