async function callGMI(projectCode) {
  if (!API_KEY) {
    throw new Error(
      "OPENAI_API_KEY غير موجود في Netlify Environment Variables."
    );
  }

  const response = await fetch(
    `${GMI_BASE_URL}/chat/completions`,
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${API_KEY}`
      },

      body: JSON.stringify({
        model: GMI_MODEL,

        messages: [
          {
            role: "system",
            content:
              "You are a senior software engineer and security-conscious code auditor."
          },
          {
            role: "user",
            content: createPrompt(projectCode)
          }
        ],

        temperature: 0,

        max_tokens: 12000
      })
    }
  );

  const responseText = await response.text();

  if (!response.ok) {
    throw new Error(
      `GMI Cloud API Error ${response.status}: ${responseText}`
    );
  }

  let data;

  try {
    data = JSON.parse(responseText);
  } catch {
    throw new Error(
      "استجابة GMI Cloud ليست JSON صحيحة."
    );
  }

  const result =
    data?.choices?.[0]?.message?.content;

  if (!result) {
    throw new Error(
      "GMI Cloud لم ترجع تقريرًا."
    );
  }

  return result;
}

