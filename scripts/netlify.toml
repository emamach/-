import fs from "fs";
import path from "path";

const ROOT = process.cwd();

const API_KEY = process.env.OPENAI_API_KEY;
const GMI_BASE_URL =
  process.env.GMI_BASE_URL || "https://api.gmi-serving.com/v1";

const GMI_MODEL =
  process.env.GMI_MODEL || "openai/gpt-5.6";

const ALLOWED_EXTENSIONS = new Set([
  ".html",
  ".htm",
  ".js",
  ".mjs",
  ".cjs",
  ".css",
  ".json",
  ".svg",
  ".md"
]);

const IGNORED_DIRS = new Set([
  ".git",
  ".github",
  "node_modules",
  ".netlify",
  "dist",
  "build",
  "coverage",
  "vendor",
  ".cache"
]);

const MAX_FILE_SIZE = 250000;
const MAX_TOTAL_CHARS = 150000;

function walk(dir) {
  const files = [];

  let entries;

  try {
    entries = fs.readdirSync(dir, {
      withFileTypes: true
    });
  } catch {
    return files;
  }

  for (const entry of entries) {
    const fullPath = path.join(dir, entry.name);

    if (entry.isDirectory()) {
      if (!IGNORED_DIRS.has(entry.name)) {
        files.push(...walk(fullPath));
      }

      continue;
    }

    const extension =
      path.extname(entry.name).toLowerCase();

    if (!ALLOWED_EXTENSIONS.has(extension)) {
      continue;
    }

    try {
      const stat = fs.statSync(fullPath);

      if (stat.size <= MAX_FILE_SIZE) {
        files.push(fullPath);
      }
    } catch {
      // تجاهل الملف
    }
  }

  return files;
}

function readProject() {
  const files = walk(ROOT);

  let totalChars = 0;
  const output = [];

  for (const file of files) {
    const relativePath = path.relative(ROOT, file);

    if (
      relativePath === "scripts/ai-audit.mjs" ||
      relativePath === "ai-audit-report.md"
    ) {
      continue;
    }

    let content;

    try {
      content = fs.readFileSync(file, "utf8");
    } catch {
      continue;
    }

    if (!content.trim()) {
      continue;
    }

    const remaining =
      MAX_TOTAL_CHARS - totalChars;

    if (remaining <= 0) {
      break;
    }

    const clipped =
      content.length > remaining
        ? content.slice(0, remaining)
        : content;

    output.push(
      `\n===== FILE: ${relativePath} =====\n` +
      clipped +
      `\n===== END FILE =====\n`
    );

    totalChars += clipped.length;
  }

  return output.join("\n");
}

