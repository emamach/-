<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1769aa">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>البث المباشر - دجاج اليمامة</title>
  <style>
    .camera-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .camera-header {
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #1d5287 0%, #2a7ab8 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
    }
    .camera-box {
      background: #000;
      border-radius: 10px;
      margin-bottom: 20px;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
    }
    .camera-placeholder {
      text-align: center;
      font-size: 3rem;
    }
  </style>
</head>
<body>
<main>
  <div class="camera-container">
    <div class="camera-header">
      <h1>📹 البث المباشر</h1>
      <p>شاهد متجرنا مباشرة</p>
    </div>
    <div class="camera-box">
      <div class="camera-placeholder">
        <div>📹</div>
        <p>لم يتم إعداد البث المباشر بعد</p>
      </div>
    </div>
    <button class="back-button" onclick="window.location.href='index.html'" style="width: 100%; padding: 12px; background: #1d5287; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700;">العودة للمتجر</button>
  </div>
</main>
</body>
</html>
