<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#1769aa">

  <link
    rel="icon"
    href="assets/icon-192.png"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <title>لوحة إدارة دجاج اليمامة</title>
</head>

<body>

<main>

  <div class="admin-container">

    <!-- ================================
         رأس لوحة الإدارة
         ================================ -->

    <div class="admin-header">

      <img
        src="assets/icon-192.png"
        alt="شعار دجاج اليمامة"
        class="admin-logo"
      >

      <h1>
        لوحة إدارة دجاج اليمامة
      </h1>

      <p>
        إدارة المنتجات والعروض والطلبات
      </p>

    </div>


    <!-- ================================
         تسجيل الدخول
         ================================ -->

    <section
      id="admin-login"
      class="admin-section"
    >

      <h2>
        🔐 دخول المدير
      </h2>

      <input
        id="admin-password"
        type="password"
        placeholder="كلمة مرور المدير"
        autocomplete="current-password"
      >

      <button
        class="primary-button"
        type="button"
        onclick="adminLogin()"
      >
        دخول
      </button>

      <p
        id="login-message"
        class="admin-message"
      ></p>

    </section>


    <!-- ================================
         لوحة التحكم
         ================================ -->

    <section
      id="admin-dashboard"
      style="display:none;"
    >


      <!-- ================================
           العروض والشريط
           ================================ -->

      <div class="admin-section">

        <h2>
          📢 العروض والشريط المتحرك
        </h2>

        <label>
          نص الشريط المتحرك
        </label>

        <input
          id="admin-ticker"
          type="text"
          placeholder="اكتب نص العرض"
        >

        <button
          class="primary-button"
          type="button"
          onclick="saveTicker()"
        >
          💾 حفظ الشريط
        </button>

      </div>


      <!-- ================================
           عامل التوصيل
           ================================ -->

      <div class="admin-section">

        <h2>
          🛵 بيانات عامل التوصيل
        </h2>

        <label>
          اسم عامل التوصيل
        </label>

        <input
          id="admin-driver-name"
          type="text"
          placeholder="اسم عامل التوصيل"
        >

        <label>
          رقم هاتف عامل التوصيل
        </label>

        <input
          id="admin-driver-phone"
          type="tel"
          placeholder="رقم الهاتف"
        >

        <button
          class="primary-button"
          type="button"
          onclick="saveDriver()"
        >
          💾 حفظ بيانات التوصيل
        </button>

      </div>


      <!-- ================================
           الكاميرات
           ================================ -->

      <div class="admin-section">

        <h2>
          📹 إعدادات البث المباشر
        </h2>

        <label>
          رابط الكاميرا الأولى
        </label>

        <input
          id="admin-camera-1"
          type="url"
          placeholder="ضع رابط بث الكاميرا الأولى"
        >

        <label>
          رابط الكاميرا الثانية
        </label>

        <input
          id="admin-camera-2"
          type="url"
          placeholder="ضع رابط بث الكاميرا الثانية"
        >

        <label>
          مدة البث بالثواني
        </label>

        <input
          id="admin-broadcast-duration"
          type="number"
          min="10"
          max="3600"
          value="45"
        >

        <button
          class="primary-button"
          type="button"
          onclick="saveCameras()"
        >
          💾 حفظ إعدادات البث
        </button>

      </div>


      <!-- ================================
           إدارة المنتجات
           ================================ -->

      <div class="admin-section">

        <h2>
          🐔 إدارة المنتجات
        </h2>

        <p class="admin-help">
          يمكنك تغيير اسم المنتج والسعر والصورة.
        </p>

        <div
          id="admin-products"
          class="admin-products"
        ></div>

        <button
          class="primary-button"
          type="button"
          onclick="addNewProduct()"
        >
          ➕ إضافة منتج جديد
        </button>

      </div>


      <!-- ================================
           الخروج
           ================================ -->

      <button
        class="logout-button"
        type="button"
        onclick="adminLogout()"
      >
        تسجيل الخروج
      </button>


      <button
        class="secondary-button"
        type="button"
        onclick="window.location.href='index.html'"
      >
        🏠 العودة إلى المتجر
      </button>

    </section>

  </div>

</main>


<script>

"use strict";


/* =========================================
   كلمة المرور التجريبية
   ========================================= */

const ADMIN_PASSWORD = "yamama123";


/* =========================================
   تسجيل دخول المدير
   ========================================= */

function adminLogin() {

  const password =
    document
      .getElementById("admin-password")
      .value;

  const message =
    document
      .getElementById("login-message");


  if (password === ADMIN_PASSWORD) {

    sessionStorage.setItem(
      "yamama_admin",
      "true"
    );

    document
      .getElementById("admin-login")
      .style.display = "none";

    document
      .getElementById("admin-dashboard")
      .style.display = "block";

    message.textContent = "";

    loadAdminData();

  } else {

    message.textContent =
      "❌ كلمة المرور غير صحيحة.";

  }

}


/* =========================================
   التحقق من تسجيل الدخول
   ========================================= */

function checkAdminLogin() {

  const logged =
    sessionStorage.getItem(
      "yamama_admin"
    );


  if (logged === "true") {

    document
      .getElementById("admin-login")
      .style.display = "none";

    document
      .getElementById("admin-dashboard")
      .style.display = "block";

    loadAdminData();

  }

}


/* =========================================
   تسجيل الخروج
   ========================================= */

function adminLogout() {

  sessionStorage.removeItem(
    "yamama_admin"
  );

  window.location.reload();

}


/* =========================================
   الإعدادات
   ========================================= */

function getSettings() {

  const saved =
    localStorage.getItem(
      "yamama_settings"
    );


  if (!saved) {

    return {

      ticker:
        "🔥 أهلاً بكم في متجر دجاج اليمامة - دجاج طازج يومياً وتوصيل مباشر 🔥",

      driverName:
        "",

      driverPhone:
        "",

      camera1:
        "",

      camera2:
        "",

      broadcastDuration:
        45

    };

  }


  try {

    return {

      ticker:
        "🔥 أهلاً بكم في متجر دجاج اليمامة - دجاج طازج يومياً وتوصيل مباشر 🔥",

      driverName:
        "",

      driverPhone:
        "",

      camera1:
        "",

      camera2:
        "",

      broadcastDuration:
        45,

      ...JSON.parse(saved)

    };

  } catch {

    return {

      ticker: "",

      driverName: "",

      driverPhone: "",

      camera1: "",

      camera2: "",

      broadcastDuration: 45

    };

  }

}


function saveSettings(settings) {

  localStorage.setItem(
    "yamama_settings",
    JSON.stringify(settings)
  );

}


/* =========================================
   تحميل بيانات لوحة الإدارة
   ========================================= */

function loadAdminData() {

  const settings =
    getSettings();


  document
    .getElementById("admin-ticker")
    .value =
      settings.ticker || "";


  document
    .getElementById("admin-driver-name")
    .value =
      settings.driverName || "";


  document
    .getElementById("admin-driver-phone")
    .value =
      settings.driverPhone || "";


  document
    .getElementById("admin-camera-1")
    .value =
      settings.camera1 || "";


  document
    .getElementById("admin-camera-2")
    .value =
      settings.camera2 || "";


  document
    .getElementById("admin-broadcast-duration")
    .value =
      settings.broadcastDuration || 45;


  renderAdminProducts();

}


/* =========================================
   حفظ الشريط
   ========================================= */

function saveTicker() {

  const settings =
    getSettings();


  settings.ticker =
    document
      .getElementById("admin-ticker")
      .value
      .trim();


  saveSettings(settings);


  alert(
    "✓ تم حفظ الشريط بنجاح"
  );

}


/* =========================================
   حفظ بيانات عامل التوصيل
   ========================================= */

function saveDriver() {

  const settings =
    getSettings();


  settings.driverName =
    document
      .getElementById("admin-driver-name")
      .value
      .trim();


  settings.driverPhone =
    document
      .getElementById("admin-driver-phone")
      .value
      .trim();


  saveSettings(settings);


  alert(
    "✓ تم حفظ بيانات عامل التوصيل"
  );

}


/* =========================================
   حفظ الكاميرات
   ========================================= */

function saveCameras() {

  const settings =
    getSettings();


  settings.camera1 =
    document
      .getElementById("admin-camera-1")
      .value
      .trim();


  settings.camera2 =
    document
      .getElementById("admin-camera-2")
      .value
      .trim();


  settings.broadcastDuration =
    Number(
      document
        .getElementById(
          "admin-broadcast-duration"
        )
        .value
    ) || 45;


  saveSettings(settings);


  alert(
    "✓ تم حفظ إعدادات البث"
  );

}


/* =========================================
   الحصول على المنتجات
   ========================================= */

function getProducts() {

  const saved =
    localStorage.getItem(
      "yamama_products"
    );


  if (!saved) {

    const products = [

      {
        id: "p1",
        name: "قطع دجاج",
        price: "18000",
        image: "",
        active: true
      },

      {
        id: "p2",
        name: "دجاج كامل",
        price: "25000",
        image: "",
        active: true
      },

      {
        id: "p3",
        name: "صدور دجاج",
        price: "24000",
        image: "",
        active: true
      },

      {
        id: "p4",
        name: "أجنحة دجاج",
        price: "16000",
        image: "",
        active: true
      },

      {
        id: "p5",
        name: "أوراك دجاج",
        price: "15000",
        image: "",
        active: true
      },

      {
        id: "p6",
        name: "كبدة دجاج",
        price: "12000",
        image: "",
        active: true
      },

      {
        id: "p7",
        name: "أعناق دجاج",
        price: "10000",
        image: "",
        active: true
      },

      {
        id: "p8",
        name: "قوانص دجاج",
        price: "11000",
        image: "",
        active: true
      }

    ];


    localStorage.setItem(
      "yamama_products",
      JSON.stringify(products)
    );


    return products;

  }


  try {

    return JSON.parse(saved);

  } catch {

    return [];

  }

}


/* =========================================
   حفظ المنتجات
   ========================================= */

function saveProducts(products) {

  localStorage.setItem(
    "yamama_products",
    JSON.stringify(products)
  );

}


/* =========================================
   عرض المنتجات داخل لوحة الإدارة
   ========================================= */

function renderAdminProducts() {

  const container =
    document.getElementById(
      "admin-products"
    );


  if (!container) {
    return;
  }


  const products =
    getProducts();


  container.innerHTML = "";


  products.forEach(
    product => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "admin-product-item";


      const imagePreview =
        product.image

          ? `
            <img
              src="${product.image}"
              class="admin-product-preview"
              alt="${escapeHTML(product.name)}"
            >
          `

          : `
            <div class="admin-no-image">
              📷 لا توجد صورة
            </div>
          `;


      item.innerHTML = `

        <div class="admin-product-preview-box">

          ${imagePreview}

        </div>


        <label>
          اسم المنتج
        </label>

        <input
          type="text"
          value="${escapeHTML(product.name)}"
          data-name
        >


        <label>
          السعر
        </label>

        <input
          type="number"
          value="${escapeHTML(product.price)}"
          data-price
          min="0"
        >


        <label class="image-upload-button">

          📷 اختيار صورة من استديو الهاتف

          <input
            type="file"
            accept="image/*"
            data-image-file
            hidden
            onchange="previewProductImage(this)"
          >

        </label>


        <button
          class="primary-button"
          type="button"
          onclick="saveProduct('${product.id}', this)"
        >
          💾 حفظ المنتج
        </button>


        <button
          class="delete-button"
          type="button"
          onclick="deleteProduct('${product.id}')"
        >
          🗑️ حذف المنتج
        </button>

      `;


      container.appendChild(item);

    }
  );

}


/* =========================================
   معاينة الصورة المختارة
   ========================================= */

function previewProductImage(input) {

  const file =
    input.files[0];


  if (!file) {
    return;
  }


  if (
    !file.type.startsWith("image/")
  ) {

    alert(
      "يرجى اختيار صورة فقط."
    );

    input.value = "";

    return;

  }


  const item =
    input.closest(
      ".admin-product-item"
    );


  const preview =
    item.querySelector(
      ".admin-product-preview"
    );


  if (preview) {

    preview.src =
      URL.createObjectURL(file);

  } else {

    const box =
      item.querySelector(
        ".admin-product-preview-box"
      );


    box.innerHTML = `

      <img
        src="${URL.createObjectURL(file)}"
        class="admin-product-preview"
        alt="معاينة الصورة"
      >

    `;

  }

}


/* =========================================
   حفظ المنتج والصورة
   ========================================= */

function saveProduct(id, button) {

  const item =
    button.closest(
      ".admin-product-item"
    );


  const name =
    item
      .querySelector("[data-name]")
      .value
      .trim();


  const price =
    item
      .querySelector("[data-price]")
      .value
      .trim();


  const imageInput =
    item.querySelector(
      "[data-image-file]"
    );


  const imageFile =
    imageInput.files[0];


  if (!name) {

    alert(
      "يرجى كتابة اسم المنتج."
    );

    return;

  }


  if (!price) {

    alert(
      "يرجى كتابة السعر."
    );

    return;

  }


  const products =
    getProducts();


  const product =
    products.find(
      p => p.id === id
    );


  if (!product) {

    alert(
      "تعذر العثور على المنتج."
    );

    return;

  }


  product.name =
    name;


  product.price =
    price;


  /*
    إذا لم يختَر المدير صورة جديدة،
    نحتفظ بالصورة القديمة.
  */

  if (!imageFile) {

    saveProducts(products);

    alert(
      "✓ تم حفظ المنتج"
    );

    renderAdminProducts();

    return;

  }


  /*
    تحويل الصورة إلى Data URL
    لحفظها محلياً في المتصفح.
  */

  const reader =
    new FileReader();


  reader.onload =
    function(event) {

      product.image =
        event.target.result;


      saveProducts(products);


      alert(
        "✓ تم حفظ المنتج والصورة"
      );


      renderAdminProducts();

    };


  reader.onerror =
    function() {

      alert(
        "تعذر قراءة الصورة."
      );

    };


  reader.readAsDataURL(
    imageFile
  );

}


/* =========================================
   إضافة منتج جديد
   ========================================= */

function addNewProduct() {

  const products =
    getProducts();


  const product = {

    id:
      "product-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 7),

    name:
      "منتج جديد",

    price:
      "0",

    image:
      "",

    active:
      true

  };


  products.push(product);


  saveProducts(products);


  renderAdminProducts();


  alert(
    "✓ تمت إضافة منتج جديد. أدخل اسمه وسعره واختر صورته ثم اضغط حفظ."
  );

}


/* =========================================
   حذف منتج
   ========================================= */

function deleteProduct(id) {

  const answer =
    confirm(
      "هل أنت متأكد من حذف هذا المنتج؟"
    );


  if (!answer) {
    return;
  }


  let products =
    getProducts();


  products =
    products.filter(
      product =>
        product.id !== id
    );


  saveProducts(products);


  renderAdminProducts();


  alert(
    "✓ تم حذف المنتج"
  );

}


/* =========================================
   حماية النصوص
   ========================================= */

function escapeHTML(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================
   تشغيل لوحة الإدارة
   ========================================= */

checkAdminLogin();

</script>

</body>
</html>
