<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#1769aa"
  >

  <link
    rel="icon"
    href="assets/icon-192.png"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <title>لوحة إدارة دجاج اليمامة</title>
</head>

<body>

  <main>

    <div class="admin-container">

      <div class="admin-header">

        <img
          src="assets/icon-192.png"
          alt="دجاج اليمامة"
          class="admin-logo"
        >

        <h1>
          لوحة إدارة دجاج اليمامة
        </h1>

        <p>
          إدارة المنتجات والعروض والطلبات
        </p>

      </div>


      <!-- تسجيل دخول المدير -->

      <section
        id="admin-login"
        class="admin-section"
      >

        <h2>
          🔐 دخول المدير
        </h2>

        <input
          id="admin-password"
          type="password"
          placeholder="كلمة مرور المدير"
        >

        <button
          class="primary-button"
          onclick="adminLogin()"
        >
          دخول
        </button>

        <p
          id="login-message"
          class="admin-message"
        ></p>

      </section>


      <!-- لوحة التحكم -->

      <section
        id="admin-dashboard"
        style="display:none;"
      >

        <!-- الشريط -->

        <div class="admin-section">

          <h2>
            📢 الشريط المتحرك
          </h2>

          <input
            id="admin-ticker"
            type="text"
            placeholder="اكتب نص العرض"
          >

          <button
            class="primary-button"
            onclick="saveTicker()"
          >
            💾 حفظ الشريط
          </button>

        </div>


        <!-- معلومات عامل التوصيل -->

        <div class="admin-section">

          <h2>
            🛵 عامل التوصيل
          </h2>

          <input
            id="admin-driver-name"
            type="text"
            placeholder="اسم عامل التوصيل"
          >

          <input
            id="admin-driver-phone"
            type="tel"
            placeholder="رقم الهاتف"
          >

          <button
            class="primary-button"
            onclick="saveDriver()"
          >
            💾 حفظ بيانات التوصيل
          </button>

        </div>


        <!-- الكاميرات -->

        <div class="admin-section">

          <h2>
            📹 إعدادات الكاميرات
          </h2>

          <label>
            رابط الكاميرا الأولى
          </label>

          <input
            id="admin-camera-1"
            type="url"
            placeholder="رابط البث للكاميرا الأولى"
          >

          <label>
            رابط الكاميرا الثانية
          </label>

          <input
            id="admin-camera-2"
            type="url"
            placeholder="رابط البث للكاميرا الثانية"
          >

          <label>
            مدة البث بالثواني
          </label>

          <input
            id="admin-broadcast-duration"
            type="number"
            min="10"
            value="45"
          >

          <button
            class="primary-button"
            onclick="saveCameras()"
          >
            💾 حفظ إعدادات الكاميرات
          </button>

        </div>


        <!-- المنتجات -->

        <div class="admin-section">

          <h2>
            🐔 المنتجات
          </h2>

          <div
            id="admin-products"
            class="admin-products"
          >
          </div>


          <button
            class="primary-button"
            onclick="addNewProduct()"
          >
            ➕ إضافة منتج جديد
          </button>

        </div>


        <!-- تسجيل الخروج -->

        <button
          class="logout-button"
          onclick="adminLogout()"
        >
          تسجيل الخروج
        </button>


        <button
          class="secondary-button"
          onclick="window.location.href='index.html'"
        >
          العودة إلى المتجر
        </button>

      </section>

    </div>

  </main>


<script>

"use strict";


/* =========================================
   كلمة المرور المؤقتة
   ========================================= */

/*
  هذه كلمة مرور تجريبية فقط.

  في مرحلة Firebase سنستبدلها
  بنظام دخول حقيقي وآمن للمدير.
*/

const ADMIN_PASSWORD =
  "yamama123";


/* =========================================
   تسجيل الدخول
   ========================================= */

function adminLogin() {

  const password =
    document.getElementById(
      "admin-password"
    ).value;


  const message =
    document.getElementById(
      "login-message"
    );


  if (
    password ===
    ADMIN_PASSWORD
  ) {

    sessionStorage.setItem(
      "yamama_admin",
      "true"
    );


    document.getElementById(
      "admin-login"
    ).style.display =
      "none";


    document.getElementById(
      "admin-dashboard"
    ).style.display =
      "block";


    loadAdminData();


  } else {

    message.textContent =
      "❌ كلمة المرور غير صحيحة.";

  }

}


/* =========================================
   التحقق من الدخول
   ========================================= */

function checkAdminLogin() {

  const logged =
    sessionStorage.getItem(
      "yamama_admin"
    );


  if (
    logged === "true"
  ) {

    document.getElementById(
      "admin-login"
    ).style.display =
      "none";


    document.getElementById(
      "admin-dashboard"
    ).style.display =
      "block";


    loadAdminData();

  }

}


/* =========================================
   تسجيل الخروج
   ========================================= */

function adminLogout() {

  sessionStorage.removeItem(
    "yamama_admin"
  );

  window.location.reload();

}


/* =========================================
   تحميل البيانات
   ========================================= */

function loadAdminData() {

  const settings =
    JSON.parse(
      localStorage.getItem(
        "yamama_settings"
      ) || "{}"
    );


  document.getElementById(
    "admin-ticker"
  ).value =
    settings.ticker || "";


  document.getElementById(
    "admin-driver-name"
  ).value =
    settings.driverName || "";


  document.getElementById(
    "admin-driver-phone"
  ).value =
    settings.driverPhone || "";


  document.getElementById(
    "admin-camera-1"
  ).value =
    settings.camera1 || "";


  document.getElementById(
    "admin-camera-2"
  ).value =
    settings.camera2 || "";


  document.getElementById(
    "admin-broadcast-duration"
  ).value =
    settings.broadcastDuration || 45;


  renderAdminProducts();

}


/* =========================================
   الإعدادات
   ========================================= */

function getSettings() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "yamama_settings"
      ) || "{}"
    );

  } catch {

    return {};

  }

}


function saveSettings(settings) {

  localStorage.setItem(
    "yamama_settings",
    JSON.stringify(settings)
  );

}


/* =========================================
   حفظ الشريط
   ========================================= */

function saveTicker() {

  const settings =
    getSettings();


  settings.ticker =
    document.getElementById(
      "admin-ticker"
    ).value;


  saveSettings(settings);


  alert(
    "✓ تم حفظ الشريط بنجاح"
  );

}


/* =========================================
   حفظ عامل التوصيل
   ========================================= */

function saveDriver() {

  const settings =
    getSettings();


  settings.driverName =
    document.getElementById(
      "admin-driver-name"
    ).value;


  settings.driverPhone =
    document.getElementById(
      "admin-driver-phone"
    ).value;


  saveSettings(settings);


  alert(
    "✓ تم حفظ بيانات عامل التوصيل"
  );

}


/* =========================================
   حفظ الكاميرات
   ========================================= */

function saveCameras() {

  const settings =
    getSettings();


  settings.camera1 =
    document.getElementById(
      "admin-camera-1"
    ).value;


  settings.camera2 =
    document.getElementById(
      "admin-camera-2"
    ).value;


  settings.broadcastDuration =
    Number(
      document.getElementById(
        "admin-broadcast-duration"
      ).value
    ) || 45;


  saveSettings(settings);


  alert(
    "✓ تم حفظ إعدادات الكاميرات"
  );

}


/* =========================================
   عرض المنتجات
   ========================================= */

function renderAdminProducts() {

  const container =
    document.getElementById(
      "admin-products"
    );


  let products = [];


  try {

    products =
      JSON.parse(
        localStorage.getItem(
          "yamama_products"
        ) || "[]"
      );

  } catch {

    products = [];

  }


  container.innerHTML = "";


  products.forEach(
    product => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "admin-product-item";


      item.innerHTML = `

        <input
          type="text"
          value="${escapeHTML(product.name)}"
          data-name
        >

        <input
          type="number"
          value="${escapeHTML(product.price)}"
          data-price
        >

        <input
          type="text"
          value="${escapeHTML(product.image || "")}"
          data-image
          placeholder="رابط الصورة"
        >

        <button
          class="primary-button"
          onclick="saveProduct('${product.id}', this)"
        >
          💾 حفظ
        </button>

        <button
          class="delete-button"
          onclick="deleteProduct('${product.id}')"
        >
          🗑️ حذف
        </button>

      `;


      container.appendChild(item);

    }
  );

}


/* =========================================
   حفظ المنتج
   ========================================= */

function saveProduct(id, button) {

  const item =
    button.parentElement;


  const name =
    item.querySelector(
      "[data-name]"
    ).value;


  const price =
    item.querySelector(
      "[data-price]"
    ).value;


  const image =
    item.querySelector(
      "[data-image]"
    ).value;


  let products =
    JSON.parse(
      localStorage.getItem(
        "yamama_products"
      ) || "[]"
    );


  const product =
    products.find(
      p => p.id === id
    );


  if (!product) return;


  product.name =
    name;

  product.price =
    price;

  product.image =
    image;


  localStorage.setItem(
    "yamama_products",
    JSON.stringify(products)
  );


  alert(
    "✓ تم حفظ المنتج"
  );

}


/* =========================================
   إضافة منتج
   ========================================= */

function addNewProduct() {

  let products =
    JSON.parse(
      localStorage.getItem(
        "yamama_products"
      ) || "[]"
    );


  const product = {

    id:
      "product-" +
      Date.now(),

    name:
      "منتج جديد",

    price:
      "0",

    image:
      "",

    active:
      true

  };


  products.push(product);


  localStorage.setItem(
    "yamama_products",
    JSON.stringify(products)
  );


  renderAdminProducts();

}


/* =========================================
   حذف منتج
   ========================================= */

function deleteProduct(id) {

  if (
    !confirm(
      "هل تريد حذف هذا المنتج؟"
    )
  ) {

    return;

  }


  let products =
    JSON.parse(
      localStorage.getItem(
        "yamama_products"
      ) || "[]"
    );


  products =
    products.filter(
      product =>
        product.id !== id
    );


  localStorage.setItem(
    "yamama_products",
    JSON.stringify(products)
  );


  renderAdminProducts();

}


/* =========================================
   حماية النص
   ========================================= */

function escapeHTML(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================
   تشغيل الصفحة
   ========================================= */

checkAdminLogin();

</script>

</body>

</html>
